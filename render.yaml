services:
  # ─── LCM Audios Node.js API ────────────────────────────────────────────────
  - type: web
    name: lcm-audios-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_BASE_URL
        value: https://lcmaudios.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: lcm-audios-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  # ─── LCM Audios PostgreSQL Database ───────────────────────────────────────
databases:
  - name: lcm-audios-db
    plan: free
    databaseName: lcm_audios_db
    user: lcm_admin
