version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: lcm_postgres
    restart: always
    environment:
      POSTGRES_USER: lcm_admin
      POSTGRES_PASSWORD: lcm_secure_password_2026
      POSTGRES_DB: lcm_audios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # LCM Audios Node.js API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lcm_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://lcm_admin:lcm_secure_password_2026@postgres:5432/lcm_audios_db?schema=public
      JWT_SECRET: lcm_faith_in_motion_jwt_secret_key_2026
    depends_on:
      - postgres

volumes:
  postgres_data:
