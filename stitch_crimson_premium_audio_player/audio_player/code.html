<style>

<body class="font-body-md text-on-background selection:bg-secondary-container">

</button>
<h1 class="font-manrope font-black tracking-widest text-red-600 uppercase text-xl">VOX LOUNGE</h1>
<button class="flex items-center justify-center text-neutral-500 hover:text-red-500 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined">settings</span>
</button>
