name: CI / Automated Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend API & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Static Type Check (TypeScript)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  flutter-checks:
    name: Flutter Client & Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: lcm_audios_app
        run: flutter pub get

      - name: Analyze Flutter Codebase
        working-directory: lcm_audios_app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Test Suite
        working-directory: lcm_audios_app
        run: flutter test
